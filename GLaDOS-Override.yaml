dns:
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.miwifi.com
    - +.docker.io
    - +.market.xiaomi.com
    - +.push.apple.com
    - +.stun.*.*
    - +.stun.*.*.*
    - stun.*.*.*
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - ntp.*.com
    - '*.ntp.org.cn'
    - pool.ntp.org
    - captive.apple.com
    - connectivitycheck.gstatic.com
    - connectivitycheck.platform.hicloud.com
    - msftconnecttest.com
    - msftncsi.com
    - dns.msftncsi.com
    - www.msftconnecttest.com
  nameserver-policy:
    rule-set:SteamCN: &china_dns
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    rule-set:OpenAI: &foreign_dns
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    rule-set:Claude: *foreign_dns
    rule-set:Gemini: *foreign_dns
    rule-set:Copilot: *foreign_dns
    rule-set:Scholar: *foreign_dns
    rule-set:GoogleSearch: *foreign_dns
    rule-set:Google: *foreign_dns
    rule-set:YouTube: *foreign_dns
    rule-set:Netflix: *foreign_dns
    rule-set:GlobalMedia: *foreign_dns
    rule-set:Steam: *foreign_dns
    rule-set:Xbox: *foreign_dns
    rule-set:Microsoft: *foreign_dns
    rule-set:Game: *foreign_dns
    rule-set:Apple: *foreign_dns
    rule-set:GitHub: *foreign_dns
    rule-set:Developer: *foreign_dns
    rule-set:Telegram: *foreign_dns
    rule-set:Twitter: *foreign_dns
    rule-set:Discord: *foreign_dns
    rule-set:Proxy: *foreign_dns
    rule-set:China: *china_dns
    "+.huggingface.co": *foreign_dns
    "+.hf.co": *foreign_dns
    "+.civitai.com": *foreign_dns
    "+.ollama.ai": *foreign_dns
    "+.ollama.com": *foreign_dns
    "+.replicate.delivery": *foreign_dns
    "+.wandb.ai": *foreign_dns
    "+.modelzoo.co": *foreign_dns
    "+.download.pytorch.org": *foreign_dns
    "+.ngc.nvidia.com": *foreign_dns
    "+.lmstudio.ai": *foreign_dns
proxy-groups:
  - name: Default Proxy
    type: select
    proxies:
      - Auto
      - Fast
      - Balancer
      - TLS
      - TW Fixed IPv6
      - JP Dedicated
      - US Dedicated
      - TW
      - US
      - SG
      - DIRECT
  - name: Research + AI
    type: select
    proxies:
      - TW Fixed IPv6
      - JP Dedicated
      - US Dedicated
      - TW
      - US
      - SG
      - DIRECT
  - name: Developer
    type: select
    proxies:
      - TW Fixed IPv6
      - JP Dedicated
      - US Dedicated
      - Fast
      - Balancer
      - TW
      - US
      - SG
      - DIRECT
  - name: Streaming
    type: select
    proxies:
      - US Streaming
      - TW
      - US
      - SG
      - DIRECT
  - name: Steam
    type: select
    proxies:
      - DIRECT
      - Fast
      - Balancer
      - TW
      - US
  - name: Game
    type: select
    proxies:
      - Fast
      - Balancer
      - TW
      - US
      - DIRECT
  - name: Apple
    type: select
    proxies:
      - DIRECT
      - Fast
      - Balancer
      - TW
      - US
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - Fast
      - Balancer
      - TW
      - US
  - name: Download
    type: select
    proxies:
      - US Download
      - DIRECT
  - name: Advertising
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: Fast
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^Fast-B1-\d+$
  - name: Balancer
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^Balancer-B1-\d+$
  - name: TLS
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^TLS-[LST]1-\d+$
  - name: US Dedicated
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-Dedicated-B1-\d+$
  - name: JP Dedicated
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^JP-Dedicated-B1-\d+$
  - name: TW Fixed IPv6
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^TW-IPv6-P1-\d+$
  - name: US Streaming
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-(?:Balancer|Netflix)-N\d+-\d+$
  - name: US Download
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^US-D1-\d+$
  - name: US
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^US-X1-\d+$
  - name: TW
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^TW-X1-\d+$
  - name: SG
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^SG-X5-\d+$
  - name: Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 100
    include-all-proxies: true
    filter: ^(?:Fast-B1|Balancer-B1|TLS-[LST]1|US-Dedicated-B1|JP-Dedicated-B1|US-(?:Balancer|Netflix)-N\d+)-\d+$
