rules:
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,AdvertisingLite,Advertising

  # Specialized rules must precede China.
  - RULE-SET,SteamCN,DIRECT
  - RULE-SET,Steam,Steam
  - RULE-SET,Xbox,Microsoft
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Game,Game
  - RULE-SET,Apple,Apple
  - RULE-SET,China,DIRECT

  - RULE-SET,OpenAI,Research + AI
  - RULE-SET,Claude,Research + AI
  - RULE-SET,Gemini,Research + AI
  - RULE-SET,Copilot,Research + AI
  - RULE-SET,Scholar,Research + AI
  - RULE-SET,GoogleSearch,Research + AI
  - RULE-SET,Google,Research + AI

  - RULE-SET,GitHub,Developer
  - RULE-SET,Developer,Developer

  - RULE-SET,YouTube,Streaming
  - RULE-SET,Netflix,Streaming
  - RULE-SET,GlobalMedia,Streaming

  # GLaDOS-specific model/download exceptions.
  - DOMAIN-SUFFIX,huggingface.co,Download
  - DOMAIN-SUFFIX,cdn-lfs.huggingface.co,Download
  - DOMAIN-SUFFIX,cdn-lfs-us-1.huggingface.co,Download
  - DOMAIN-SUFFIX,cdn-lfs-eu-1.huggingface.co,Download
  - DOMAIN-SUFFIX,hf.co,Download
  - DOMAIN-SUFFIX,civitai.com,Download
  - DOMAIN-SUFFIX,ollama.ai,Download
  - DOMAIN-SUFFIX,ollama.com,Download
  - DOMAIN-SUFFIX,replicate.delivery,Download
  - DOMAIN-SUFFIX,wandb.ai,Download
  - DOMAIN-SUFFIX,api.wandb.ai,Download
  - DOMAIN-SUFFIX,modelzoo.co,Download
  - DOMAIN-SUFFIX,download.pytorch.org,Download
  - DOMAIN-SUFFIX,ngc.nvidia.com,Download
  - DOMAIN-SUFFIX,api.ngc.nvidia.com,Download
  - DOMAIN-SUFFIX,lmstudio.ai,Download

  - RULE-SET,Telegram,Default Proxy
  - RULE-SET,Twitter,Default Proxy
  - RULE-SET,Discord,Default Proxy

  - DOMAIN-SUFFIX,glados.vip,Default Proxy
  - DOMAIN-SUFFIX,glados.work,Default Proxy

  - RULE-SET,Proxy,Default Proxy
  - GEOIP,CN,DIRECT
  - GEOIP,PRIVATE,DIRECT
  - MATCH,Default Proxy
