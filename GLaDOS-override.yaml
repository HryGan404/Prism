proxy-groups:
  # Select groups
  - name: Default Proxy
    type: select
    proxies:
      - Auto
      - Fast
      - Express
      - TW Private IP
      - US Premium
      - US Dedicated
      - JP Dedicated
      - US
      - TW
      - TLS
      - DIRECT

  - name: AI + Research
    type: select
    proxies:
      - TW Private IP
      - US Dedicated
      - JP Dedicated
      - US
      - TW
      - TLS

  - name: Streaming
    type: select
    proxies:
      - Express
      - TW Private IP
      - US Premium
      - US Netflix
      - US Dedicated
      - JP Dedicated

  - name: Developer
    type: select
    proxies:
      - Fast
      - TW Private IP
      - US Dedicated
      - JP Dedicated
      - US
      - TW
      - TLS

  - name: Steam
    type: select
    proxies:
      - DIRECT
      - Fast
      - Download
      - TW Private IP
      - US Dedicated
      - JP Dedicated
      - US
      - TW
      - TLS

  - name: Games
    type: select
    proxies:
      - Fast
      - Download
      - TW Private IP
      - US Dedicated
      - JP Dedicated
      - US
      - TW
      - TLS
      - DIRECT

  - name: Apple
    type: select
    proxies:
      - DIRECT
      - US Premium
      - US Netflix

  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - US Premium
      - US Netflix

  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: Final
    type: select
    proxies:
      - Default Proxy
      - DIRECT

  # Hidden groups
  - name: Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^(?:Fast-B1|Balancer-B1|TW-IPv6-P1|US-Balancer-N1|US-Dedicated-B1|JP-Dedicated-B1|US-X1|TW-X1|TLS-[TLS]1)-\d+$

  - name: Fast
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^Fast-B1-\d+$

  - name: Express
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^Balancer-B1-\d+$

  - name: Download
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-D1-\d+$

  - name: TW Private IP
    type: fallback
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^TW-IPv6-P1-\d+$

  - name: US Premium
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-Balancer-N1-\d+$

  - name: US Netflix
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-Netflix-N2-\d+$

  - name: US Dedicated
    type: fallback
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^US-Dedicated-B1-\d+$

  - name: JP Dedicated
    type: fallback
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    include-all-proxies: true
    filter: ^JP-Dedicated-B1-\d+$

  - name: US
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^US-X1-\d+$

  - name: TW
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^TW-X1-\d+$

  - name: TLS
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: ^TLS-[TLS]1-\d+$

