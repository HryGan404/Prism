  - name: Streaming
    type: select
    proxies:
      - HK
      - TW
      - JP
      - SG
      - US
  - name: Porn
    type: select
    proxies:
      - HK
      - TW
      - JP
      - SG
      - US
  - name: Download
    type: select
    proxies:
      - DIRECT
      - HK
      - TW
      - JP
      - SG
      - US
  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: Final
    type: select
    proxies:
      - Default Proxy
      - DIRECT
  - name: Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 100
    include-all-proxies: true
    filter: (?i)^(?:0\\.[0-9]+|1\\.0)X\\s+
  - name: HK
    type: select
    proxies:
      - HK Auto
    include-all-proxies: true
    filter: (?i)(香港|hong\\s?kong|(?:^|[\\s\\-_|\\[\\]()])hk(?:$|[\\s\\-_|\\[\\]()]))
  - name: HK Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)(香港|hong\\s?kong|(?:^|[\\s\\-_|\\[\\]()])hk(?:$|[\\s\\-_|\\[\\]()]))
  - name: TW
    type: select
