dns:
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - +.miwifi.com
    - +.push.apple.com
    - +.stun.*.*
    - captive.apple.com
    - connectivitycheck.gstatic.com
    - msftconnecttest.com
    - msftncsi.com
  nameserver-policy:
    rule-set:China: &china_dns
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    rule-set:SteamCN: *china_dns
    rule-set:Proxy: &foreign_dns
      - https://dns.google/dns-query
      - https://cloudflare-dns.com/dns-query
    rule-set:Google: *foreign_dns
    rule-set:AI: *foreign_dns
    rule-set:Scholar: *foreign_dns
    rule-set:Apple: *foreign_dns
    rule-set:Microsoft: *foreign_dns
    rule-set:Xbox: *foreign_dns
    rule-set:Steam: *foreign_dns
    rule-set:GitHub: *foreign_dns
    rule-set:Developer: *foreign_dns
    rule-set:Telegram: *foreign_dns
    rule-set:Twitter: *foreign_dns
    rule-set:Discord: *foreign_dns
    rule-set:Netflix: *foreign_dns
    rule-set:Porn: *foreign_dns
    rule-set:PornAsia: *foreign_dns
    rule-set:GlobalMedia: *foreign_dns
    rule-set:Download: *foreign_dns
proxy-groups:
  - name: Default Proxy
    type: select
    proxies:
      - Auto
      - HK
      - TW
      - JP
      - SG
      - US
      - DIRECT
  - name: AI + Research
    type: select
    proxies:
      - HK
