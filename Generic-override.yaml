proxy-groups:
  # Select groups
  - name: Default Proxy
    type: select
    proxies:
      - Auto
      - HK
      - TW
      - SG
      - JP
      - US
      - DIRECT

  - name: AI + Research
    type: select
    proxies:
      - JP
      - US
      - HK
      - TW
      - SG

  - name: Streaming
    type: select
    proxies:
      - HK
      - TW
      - SG
      - JP
      - US

  - name: Developer
    type: select
    proxies:
      - HK
      - TW
      - SG
      - JP
      - US

  - name: Steam
    type: select
    proxies:
      - DIRECT
      - HK
      - TW
      - SG
      - JP
      - US

  - name: Games
    type: select
    proxies:
      - HK
      - TW
      - SG
      - JP
      - US
      - DIRECT

  - name: Apple
    type: select
    proxies:
      - DIRECT
      - HK
      - TW
      - SG
      - JP
      - US

  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - HK
      - TW
      - SG
      - JP
      - US

  - name: AdBlock
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: Final
    type: select
    proxies:
      - Default Proxy
      - DIRECT

  # Region groups
  - name: HK
    type: select
    proxies:
      - HK Auto
    include-all-proxies: true
    filter: (?i)香港|hk|hong\s?kong

  - name: TW
    type: select
    proxies:
      - TW Auto
    include-all-proxies: true
    filter: (?i)台湾|tw|tai\s?wan

  - name: SG
    type: select
    proxies:
      - SG Auto
    include-all-proxies: true
    filter: (?i)新加坡|sg|singapore

  - name: JP
    type: select
    proxies:
      - JP Auto
    include-all-proxies: true
    filter: (?i)日本|jp|japan

  - name: US
    type: select
    proxies:
      - US Auto
    include-all-proxies: true
    filter: (?i)美国|us|united|\s?states

  # Hidden groups
  - name: Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 100
    include-all-proxies: true
    filter: (?i)^[01]\.[0-9]+X\s+.+$

  - name: HK Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)香港|hk|hong\s?kong

  - name: TW Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)台湾|tw|tai\s?wan

  - name: SG Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)新加坡|sg|singapore

  - name: JP Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)日本|jp|japan

  - name: US Auto
    type: url-test
    hidden: true
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    include-all-proxies: true
    filter: (?i)美国|us|united|\s?states

