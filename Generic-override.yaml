rules:
  - RULE-SET,Lan,DIRECT
  - RULE-SET,Direct,DIRECT
  - RULE-SET,AdvertisingLite,AdBlock

  - RULE-SET,SteamCN,DIRECT
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT

  - RULE-SET,Steam,Steam
  - GEOSITE,steam,Steam
  - GEOSITE,category-games,Games

  - RULE-SET,Claude,AI + Research
  - RULE-SET,OpenAI,AI + Research
  - RULE-SET,Gemini,AI + Research
  - RULE-SET,Scholar,AI + Research

  - RULE-SET,GoogleDrive,Download

  - RULE-SET,Google,Default Proxy

  - RULE-SET,GitHub,Developer

  - RULE-SET,YouTube,Streaming

  - RULE-SET,Telegram,Default Proxy
  - RULE-SET,Twitter,Default Proxy
  - RULE-SET,Discord,Default Proxy

  - RULE-SET,Apple,Apple
  - RULE-SET,Microsoft,Microsoft

  - RULE-SET,Proxy,Default Proxy

  - GEOIP,PRIVATE,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve

  - MATCH,Final
